name: Build and Push Docker Image

# 允许手动触发工作流
on:
  workflow_dispatch:
    inputs:
      version:
        description: '镜像版本号（留空 = 自动取 Docker Hub 最新已发布版本 +1）'
        required: false
        default: ''
      bump:
        description: '版本号递增方式（仅在版本号留空时生效）'
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
        default: auto

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # 先登录，后面既用于推送镜像，也用于查询 Docker Hub 上是否已存在同名 tag
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      # === 版本号解析：留空就以 Docker Hub 上最新已发布版本为基准自动递增 ===
      - name: Resolve version
        id: version
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          INPUT_VERSION: ${{ inputs.version }}
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail

          REPO="${DOCKERHUB_USERNAME}/cloud-auto-save"
          # 允许输入 v1.0.7 这种写法
          INPUT_VERSION="${INPUT_VERSION#v}"

          bump_version() {
            local core="${1%%-*}" major minor patch
            IFS='.' read -r major minor patch <<< "$core"
            major=${major:-0}; minor=${minor:-0}; patch=${patch:-0}
            case "$2" in
              major) echo "$((major + 1)).0.0" ;;
              minor) echo "${major}.$((minor + 1)).0" ;;
              *)     echo "${major}.${minor}.$((patch + 1))" ;;
            esac
          }

          tag_exists() {
            docker manifest inspect "${REPO}:$1" >/dev/null 2>&1
          }

          # 取 Docker Hub 上已发布的最高正式版本号（忽略 latest、beta 之类的 tag）
          latest_published() {
            local names
            names=$(curl -fsS --max-time 20 \
              "https://hub.docker.com/v2/repositories/${REPO}/tags?page_size=100&ordering=last_updated" \
              | jq -r '.results[].name' 2>/dev/null) || return 1
            printf '%s\n' "$names" \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -t. -k1,1n -k2,2n -k3,3n \
              | tail -n 1
          }

          if [ -n "$INPUT_VERSION" ]; then
            # 手动指定时原样使用，已存在也允许覆盖重建
            VERSION="$INPUT_VERSION"
            BASE_VERSION="$INPUT_VERSION"
            echo "使用手动输入的版本号: ${VERSION}"
          else
            BASE_VERSION=$(latest_published || true)
            if [ -z "$BASE_VERSION" ]; then
              echo "::error::无法从 Docker Hub 读取 ${REPO} 的已发布版本，请手动填写 version 后重试"
              exit 1
            fi
            case "$BUMP" in
              major) VERSION=$(bump_version "$BASE_VERSION" major) ;;
              minor) VERSION=$(bump_version "$BASE_VERSION" minor) ;;
              *)     VERSION=$(bump_version "$BASE_VERSION" patch) ;;
            esac
            echo "Docker Hub 最新已发布版本: ${BASE_VERSION}，本次构建: ${VERSION}"
          fi

          # 自动解析时如果版本已被占用（例如并发构建），继续 +1
          if [ -z "$INPUT_VERSION" ]; then
            i=0
            while tag_exists "$VERSION"; do
              VERSION=$(bump_version "$VERSION" patch)
              i=$((i + 1))
              if [ "$i" -ge 50 ]; then
                echo "::error::连续 50 次递增后仍找不到可用版本号，请手动指定 version"
                exit 1
              fi
            done
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          {
            echo "### 本次构建版本"
            echo ""
            echo "- 镜像 tag: \`$VERSION\`"
            echo "- Docker Hub 最新已发布版本: \`$BASE_VERSION\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # === 核心修复步骤 1：引入并配置高兼容性的 QEMU ===
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          # 强制指定社区验证过的稳定 QEMU 镜像，防止 Node 20 编译时触发非法指令崩溃
          image: tonistiigi/binfmt:qemu-v7.0.0-28

      # === 核心修复步骤 2：升级 Buildx 到 v3 ===
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # === 核心修复步骤 3：升级 Build-Push 到 v6 并加入缓存 ===
      - name: Build and push Docker images
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cloud-auto-save:${{ steps.version.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/cloud-auto-save:latest
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          # 建议开启 gha 缓存，跨架构模拟构建非常耗时，缓存可以极大加速后续构建
          cache-from: type=gha
          cache-to: type=gha,mode=max
